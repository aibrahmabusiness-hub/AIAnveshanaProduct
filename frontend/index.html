<!DOCTYPE html>
<html lang="en">
<head>
    <script src="/config.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ai Anveshana Platform - Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&family=Open+Sans:wght@300;400;600&family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <script>
        // Authentication check before loading content
        if (!localStorage.getItem('token')) {
            window.location.href = '/login';
        }
    </script>
</head>
<body>
    <header class="top-header">
        <div class="logo">
            <svg viewBox="0 0 100 100" class="logo-img" style="height: 35px; width: 35px;"><rect x="0" y="35" width="100" height="30" rx="15" class="logo-rect" transform="rotate(45 50 50)" /><circle cx="22" cy="78" r="20" class="logo-circle" /><circle cx="78" cy="22" r="20" class="logo-circle" /></svg>
            <span class="logo-text" style="font-weight:700; margin-left:8px; font-size:1.25rem;">Ai <span class="highlight">Anveshana</span></span>
        </div>
        <div class="header-right">
            <div class="profile-container">
                <div class="profile-avatar" id="userAvatar" style="cursor:pointer;">U</div>
                <div class="profile-dropdown" id="profileDropdown">
                    <div class="profile-dropdown-header">
                        <div class="profile-dropdown-username" id="dropdownUsername">User</div>
                        <div class="profile-dropdown-role">User</div>
                    </div>
                    <button class="profile-dropdown-item" id="openGlobalSettingsBtn">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                        LLM Setting
                    </button>
                    <button class="profile-dropdown-item" id="dropdownLogoutBtn">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                        Log Out
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="dashboard-main">
        <div class="dashboard-controls">
            <h2>Your Projects</h2>
            <div class="controls-right" style="display:flex; align-items:center; gap:12px;">
                <div class="search-box">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" placeholder="Search Projects" id="searchInput">
                </div>
                <div class="view-toggle-btn" id="viewToggleBtn" title="Toggle Grid/List View" style="cursor:pointer; display:flex; align-items:center; justify-content:center; width:38px; height:38px; border:1px solid var(--border-color); border-radius:10px; background:var(--bg-secondary); color:var(--text-secondary); transition:all 0.2s;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="gridIcon"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="listIcon" style="display:none;"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><circle cx="3" cy="6" r="1" fill="currentColor"></circle><circle cx="3" cy="12" r="1" fill="currentColor"></circle><circle cx="3" cy="18" r="1" fill="currentColor"></circle></svg>
                </div>
            </div>
        </div>

        <div class="projects-grid" id="projectsGrid">
            <div class="project-card create-card" id="createNewBtn">
                <div style="font-size:2.5rem; color:var(--accent-color); margin-bottom:8px;">+</div>
                <div style="font-weight:600; color:var(--text-main);">Create New Project</div>
                <div style="font-size:0.85rem; color:var(--text-muted); text-align:center; margin-top:4px;">Configure a new custom agent with dynamic tool bindings</div>
            </div>
        </div>
    </main>

    
    <!-- Global Settings Modal -->
    <div class="modal-overlay" id="globalSettingsModal">
        <div class="modal" style="width:580px; max-height: 85vh; overflow-y: auto;">
            <div class="modal-header">
                <h3>LLM Setting</h3>
                <button class="close-btn" id="closeGlobalSettingsBtn">&times;</button>
            </div>
            <div style="padding: 20px;">
                <p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:16px;">Configure global LLM connections that can be used across all your projects.</p>
                <form id="addGlobalLlmForm" style="display:flex; flex-direction:column; gap:12px; margin-bottom:20px;">
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                        <div class="form-group" style="margin-bottom:0;">
                            <label>Provider</label>
                            <select id="globalLlmProvider" style="width:100%; padding:10px; border:1px solid var(--border-color); border-radius:6px; font-family:inherit;">
                                <option value="gemini">Google Gemini</option>
                                <option value="openai">OpenAI</option>
                                <option value="anthropic">Anthropic</option>
                                <option value="mistral">Mistral AI</option>
                            </select>
                        </div>
                        <div class="form-group" style="margin-bottom:0;">
                            <label>Model Name</label>
                            <input type="text" id="globalLlmModel" placeholder="e.g. gpt-4o, gemini-1.5-pro">
                        </div>
                    </div>
                    <div class="form-group" style="margin-bottom:0;">
                        <label>API Key</label>
                        <input type="password" id="globalLlmKey" placeholder="Enter API Key">
                    </div>
                    <div style="display:flex; gap:10px; margin-top:8px;">
                        <button type="submit" class="btn-primary" id="saveGlobalLlmBtn">Add Global LLM</button>
                        <button type="button" id="testGlobalLlmBtn" class="btn-cancel" style="border: 1px solid var(--orange-primary); color: var(--orange-primary); background: none; font-weight:600;">Test Connection</button>
                    </div>
                    <div id="globalLlmTestStatus" style="font-size:0.85rem; padding:8px; border-radius:6px; margin-top:8px; display:none;"></div>
                </form>
                
                <h4>Your Global LLMs</h4>
                <div id="globalLlmConfigsList" style="margin-top:10px; display:flex; flex-direction:column; gap:8px;">
                    <!-- Configs injected here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Create Project Modal -->
    <div class="modal-overlay" id="createModal">
        <div class="modal" style="width:480px;">
            <div class="modal-header">
                <h3>Create New Project</h3>
                <button class="close-btn" id="closeModalBtn">&times;</button>
            </div>
            <form id="createProjectForm">
                <div class="form-group">
                    <label>Project Name</label>
                    <input type="text" id="projectName" required placeholder="e.g. IT Issue Resolver">
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <input type="text" id="projectDesc" required placeholder="e.g. Resolves IT tickets via email">
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary">Create Project</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/script.js"></script>
</body>
</html>
